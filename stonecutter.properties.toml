# Propriétés centralisées Stonecutter. Chaque version a sa propre table, identifiée par le
# nom exact du dossier sous versions/. Une clé absente dans une table de version signifie
# simplement que cette dépendance n'est pas utilisée pour cette version (remplace l'ancien
# sentinel "[VERSIONED]" des gradle.properties par sous-projet).
maven_group = "net.paulem.simpleores"

mod.id = "simpleores"
mod.version = "1.9.11"

deps.fabric_loader = "0.19.3"
deps.fabricloader_version = "*"

# Version de Loom que loom-back-compat doit appliquer en interne (Mojmaps ou remap selon la
# version ciblée) — remplace les déclarations manuelles de fabric-loom / fabric-loom-remap.
loomx.loom_version = "1.17-SNAPSHOT"

breaks.fabric_api = "<0.1"


