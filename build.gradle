import ovh.paulem.buildscript.*

plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'

	id "me.shedaniel.unified-publishing" version "0.1.+"
}

version = project.mod_version + "-" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
	maven { url "https://maven.shedaniel.me/" }
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url "https://maven.architectury.dev/" }
	maven {
		name "paulemReleases"
		url "https://maven.paulem.ovh/releases"
	}
	mavenLocal()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"simpleores" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration() {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	/*modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modImplementation("com.terraformersmc:modmenu:${mod_menu_version}")*/
}

processResources {
	def expandProps = [
			"version": version,
			"min_version_range": preToBeta(min_version_range),
			"max_version_range": preToBeta(max_version_range),
	]

	filesMatching(['fabric.mod.json', '*.mixins.json']) {
		expand expandProps
	}
	inputs.properties(expandProps)
}

static def preToBeta(String version) {
	if (version == null) return null
	return version
			.replaceAll(/-rc(\d+)/, '-rc.$1')
			.replaceAll(/-pre(\d+)/, '-beta.$1')
}

def javaversion = JavaVersion.values()[project.java_version.toInteger()-1]

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaversion.toString().toInteger()
}

java {
	sourceCompatibility = javaversion
	targetCompatibility = javaversion
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// ------------------------ PUBLISH MODS ------------------------
unifiedPublishing {
	project {
		displayName = "SimpleOres Refabricated ${project.mod_version}" // Optional, name of the file
		version = project.version.toString() // Optional, Inferred from project by default
		changelog = "**This version does not include the copper bucket, as BucketLib has not yet been updated!**\n\n" + NewGithubChangelog.getChangelog() // Optional, in markdown format
		releaseType = "release" // Optional, use "release", "beta" or "alpha"
		gameVersions = VersionRangeParser.parseVersionRange(min_version_range, max_version_range)
		gameLoaders = ["fabric", "quilt"]

		mainPublication tasks.remapJar // Declares the publicated jar

		relations {
			depends {
				modrinth = "fabric-api"
				curseforge = "fabric-api"
			}
			depends {
				modrinth = "cloth-config"
				curseforge = "cloth-config"
			}
			optional {
				modrinth = "modmenu"
				curseforge = "modmenu"
			}
			optional {
				modrinth = "energized-power"
				curseforge = "energized-power"
			}
			includes {
				modrinth = "bucketlib"
				curseforge = "bucketlib"
			}
		}

		var curseforgeToken = project.findProperty('CURSEFORGE_TOKEN').toString() ?: System.getenv("CURSEFORGE_TOKEN")
		if (curseforgeToken != null) {
			curseforge {
				token = curseforgeToken
				id = "1092987" // Required, must be a string, ID of CurseForge project
			}
		}

		var modrinthToken = project.findProperty('MODRINTH_TOKEN').toString() ?: System.getenv("MODRINTH_TOKEN")
		if (modrinthToken != null) {
			modrinth {
				token = modrinthToken
				id = "Boe3chj8" // Required, must be a string, ID of Modrinth project
			}
		}
	}
}