name: 🔨 Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    # Le changelog est récupéré pendant la phase de configuration de Gradle : sans ce token
    # au niveau du job, les tâches interrogent l'API GitHub anonymement (60 req/h partagées).
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🪄 Cache gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
            ~/.gradle/wrapper
            ~/.gradle/build-cache-*
            ~/.gradle/configuration-cache-*
            .gradle/patchCache
            .gradle/patched
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'patches/**/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🪄 Gradle Cache Cleanup
        run: |
          mkdir -p ~/.gradle/caches/modules-2
          [ -f ~/.gradle/caches/modules-2/modules-2.lock ] && rm -f ~/.gradle/caches/modules-2/modules-2.lock
          find ~/.gradle/caches -name "*.lock" -type f -delete || echo "No lock files found"

      - name: Configure Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=true" >> ~/.gradle/gradle.properties

      - name: 🛠️ Setup jdk 25
        uses: actions/setup-java@v6
        with:
          distribution: 'graalvm'
          java-version: 25
          java-package: jdk
        # To prevent rate limiting on GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🆙 Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: runDatagen
        run: |
          PARALLELISM=$(($(nproc) * 2))
          ./gradlew runDatagen --stacktrace --parallel \
          --max-workers=$PARALLELISM \
          --build-cache

      - name: 🔨 Build project
        run: |
          PARALLELISM=$(($(nproc) * 2))
          ./gradlew build --stacktrace --parallel \
          --max-workers=$PARALLELISM \
          --build-cache

      - name: 📂 Gather Artifacts
        run: |
          mkdir -p dist
          find versions -maxdepth 4 -type f -name "*.jar" -path "*/build/libs/*" -exec cp {} dist/ \;

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          if-no-files-found: error
          path: dist/
      
      - name: 📦 Create GitHub Release
        if: ${{ github.ref == 'refs/heads/stonecutter' }}
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.sha }}
          tag_name: release-${{ github.sha }}
          generate_release_notes: true
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}