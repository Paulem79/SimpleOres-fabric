name: 🚀 Publish
on:
  workflow_dispatch:
    inputs:
      source:
        description: "D'où viennent les jars à publier"
        type: choice
        default: build
        options:
          - build            # rebuilds everything (datagen + build)
          - last-build-run   # jars of the last successful Build run on stonecutter
          - last-release     # jars of the last GitHub release (release-<sha>)

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # One Minecraft version per job, like build.yml. Each job publishes its jars to Modrinth/CurseForge
  # The single GitHub release is created at the end by the release job
  publish:
    name: 🚀 ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions: write-all
    timeout-minutes: 60

    strategy:
      fail-fast: false
      # Cleans up maven.paulem.net (self-hosted) and the Modrinth and CurseForge APIs
      max-parallel: 4
      matrix:
        include:
          - { version: "1.19.4", neoforge: false }
          - { version: "1.20.1", neoforge: false }
          - { version: "1.20.4", neoforge: false }
          - { version: "1.20.6", neoforge: false }
          - { version: "1.21", neoforge: true }
          - { version: "1.21.3", neoforge: true }
          - { version: "1.21.5", neoforge: true }
          - { version: "1.21.6", neoforge: true }
          - { version: "1.21.7", neoforge: true }
          - { version: "1.21.9", neoforge: true }
          - { version: "1.21.11", neoforge: true }
          - { version: "26.1", neoforge: true }
          - { version: "26.2", neoforge: true }
          - { version: "26.3", neoforge: true }
          - { version: "26.4", neoforge: false }

    # The changelog is fetched while configuring Gradle, the token avoids anonymous API rate limits
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🛠️ Setup jdk 25
        uses: actions/setup-java@v6
        with:
          distribution: 'graalvm'
          java-version: 25
          java-package: jdk
        # To prevent rate limiting on GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🪄 Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/stonecutter' }}

      - name: Configure Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.workers.max=$(nproc)" >> ~/.gradle/gradle.properties
          # The NeoForged maven sometimes answers 502, retry the downloads a few more times
          echo "systemProp.org.gradle.internal.repository.max.retries=6" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.repository.initial.backoff=2000" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.http.connectionTimeout=60000" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=60000" >> ~/.gradle/gradle.properties
          echo "MOD_VERSION=$(sed -n 's/^mod.version *= *"\(.*\)"/\1/p' stonecutter.properties.toml | head -1)" >> "$GITHUB_ENV"

      - name: 🆙 Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # --- source = build: rebuild ---

      # Datagen only runs on the Fabric node and NeoForge reuses its output, so it must finish first
      - name: runDatagen
        if: ${{ inputs.source == 'build' }}
        run: |
          # Minecraft downloads sometimes get cut off: the files already downloaded stay cached, so retrying resumes the work
          for attempt in 1 2 3; do
            ./gradlew ":${{ matrix.version }}-fabric:runDatagen" --stacktrace && break
            [ "$attempt" = 3 ] && exit 1
            echo "Attempt $attempt failed, retrying"
          done

      - name: 🔨 Build project
        if: ${{ inputs.source == 'build' }}
        run: |
          TASKS=":${{ matrix.version }}-fabric:build"
          if [ "${{ matrix.neoforge }}" = "true" ]; then
            TASKS="$TASKS :${{ matrix.version }}-neoforge:build"
          fi
          for attempt in 1 2 3; do
            ./gradlew $TASKS --stacktrace && break
            [ "$attempt" = 3 ] && exit 1
            echo "Attempt $attempt failed, retrying"
          done

      - name: 📂 Gather built jars
        if: ${{ inputs.source == 'build' }}
        run: |
          mkdir -p dist
          find versions -maxdepth 4 -type f -name "*.jar" -path "*/build/libs/*" -exec cp {} dist/ \;

      # --- source = last-build-run / last-release: reuse existing jars ---

      - name: 📥 Fetch jars from the last successful Build run
        if: ${{ inputs.source == 'last-build-run' }}
        run: |
          RUN_ID=$(gh run list --workflow build.yml --branch stonecutter --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$RUN_ID" ] || { echo "Aucun run Build réussi sur stonecutter"; exit 1; }
          echo "Jars du run Build $RUN_ID"
          gh run download "$RUN_ID" --name "dist-${{ matrix.version }}" --dir dist

      - name: 📥 Fetch jars from the last GitHub release
        if: ${{ inputs.source == 'last-release' }}
        run: |
          TAG=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("release-"))][0].tagName')
          [ -n "$TAG" ] || { echo "Aucune release release-<sha> trouvée"; exit 1; }
          echo "Jars de la release $TAG"
          PATTERNS=(-p "simpleores-${MOD_VERSION}-${{ matrix.version }}-fabric.jar")
          if [ "${{ matrix.neoforge }}" = "true" ]; then
            PATTERNS+=(-p "simpleores-${MOD_VERSION}-${{ matrix.version }}-neoforge.jar")
          fi
          gh release download "$TAG" "${PATTERNS[@]}" --dir dist

      - name: 🔎 Check jars
        run: |
          ls -l dist
          for loader in fabric $([ "${{ matrix.neoforge }}" = "true" ] && echo neoforge); do
            JAR="dist/simpleores-${MOD_VERSION}-${{ matrix.version }}-$loader.jar"
            [ -f "$JAR" ] || { echo "Jar manquant : $JAR (la version du mod a-t-elle changé depuis la source ?)"; exit 1; }
          done

      - name: ⬆️ Upload to Modrinth/CurseForge
        run: |
          TASKS=":${{ matrix.version }}-fabric:publishMods"
          if [ "${{ matrix.neoforge }}" = "true" ]; then
            TASKS="$TASKS :${{ matrix.version }}-neoforge:publishMods"
          fi
          # Published serially, the prebuilt jars (dist/) are uploaded as they are
          ./gradlew $TASKS --stacktrace --no-parallel --max-workers=1 -PprebuiltJarsDir="$PWD/dist"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_UPLOAD_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_UPLOAD_TOKEN }}
          # PAT with a larger quota than the installation GITHUB_TOKEN, falls back to GITHUB_TOKEN when empty
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: 📂 Keep the changelog for the release
        run: cp changelog.txt dist/ || echo "Pas de changelog.txt"

      - name: 📦 Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.version }}
          if-no-files-found: error
          path: dist/

  # One GitHub release (one tag) for every version, with all the Fabric and NeoForge jars
  release:
    name: 📦 Release
    needs: publish
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v7

      - name: 📥 Download jars
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: 🏷️ Read the mod version
        run: echo "MOD_VERSION=$(sed -n 's/^mod.version *= *"\(.*\)"/\1/p' stonecutter.properties.toml | head -1)" >> "$GITHUB_ENV"

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: SimpleOres ${{ env.MOD_VERSION }}
          tag_name: ${{ env.MOD_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: dist/changelog.txt
          files: dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
