name: 🚀 Publish
on:
  workflow_dispatch:
  push:
      tags:
        - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist-artifacts from last build.yml run
        uses: actions/github-script@v7
        id: get_run
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "🔨 Build",
              status: "success",
              per_page: 1
            });
            return runs.data.workflow_runs[0].id;

      - name: Download dist-artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.get_run.outputs.result }}
          name: dist-artifacts
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬆️ Upload to Modrinth/CurseForge
        run: ./gradlew publishUnified
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_UPLOAD_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_UPLOAD_TOKEN }}
          GITHUB_EVENT_RAW_PATH: ${{ github.event_path }}
          GITHUB_COMMIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true