name: 🚀 Publish
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: write-all

    # Le changelog est récupéré pendant la phase de configuration de Gradle : sans ce token
    # au niveau du job, `runDatagen` et `build` interrogent l'API GitHub anonymement (60 req/h
    # partagées) et épuisent le quota avant même l'étape de publication.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🪄 Cache gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
            ~/.gradle/wrapper
            ~/.gradle/build-cache-*
            ~/.gradle/configuration-cache-*
            .gradle/patchCache
            .gradle/patched
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'patches/**/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🪄 Gradle Cache Cleanup
        run: |
          mkdir -p ~/.gradle/caches/modules-2
          [ -f ~/.gradle/caches/modules-2/modules-2.lock ] && rm -f ~/.gradle/caches/modules-2/modules-2.lock
          find ~/.gradle/caches -name "*.lock" -type f -delete || echo "No lock files found"

      - name: Configure Gradle Properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=true" >> ~/.gradle/gradle.properties

      - name: 🛠️ Setup jdk 25
        uses: actions/setup-java@v5
        with:
          distribution: 'graalvm'
          java-version: 25
          java-package: jdk
        # To prevent rate limiting on GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🆙 Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: runDatagen
        run: |
          PARALLELISM=$(($(nproc) * 2))
          ./gradlew runDatagen --stacktrace --parallel \
          --max-workers=$PARALLELISM \
          --build-cache

      - name: 🔨 Build project
        run: |
          PARALLELISM=$(($(nproc) * 2))
          ./gradlew build --stacktrace --parallel \
          --max-workers=$PARALLELISM \
          --build-cache

      - name: ⬆️ Upload to Modrinth/CurseForge
        # Publication en série : les 14 versions créent chacune une release GitHub, et un envoi
        # parallèle déclenche la limite de débit de l'API (403 "rate limit exceeded").
        run: ./gradlew publishMods --no-parallel --max-workers=1
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_UPLOAD_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_UPLOAD_TOKEN }}
          GITHUB_EVENT_RAW_PATH: ${{ github.event_path }}
          # PAT au quota plus large que le GITHUB_TOKEN d'installation ; si le secret est absent,
          # la valeur est vide et build.gradle.kts retombe sur GITHUB_TOKEN.
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}