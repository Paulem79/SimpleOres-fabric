name: Build
on:
  push:
    branches:
      - "alpha-1.21.5"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: runDatagen
        run: ./gradlew runDatagen

      - name: build
        run: ./gradlew build

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    permissions: write-all

    if: contains(github.event.head_commit.message, 'PUBLISH') && github.repository == 'Paulem79/SimpleOres-fabric' && github.ref == 'refs/heads/alpha-1.21.5'

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: runDatagen
        run: ./gradlew runDatagen

      - name: build
        run: ./gradlew build

      - name: ⬆️ Upload to Modrinth
        run: ./gradlew modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_UPLOAD_TOKEN }}
          GITHUB_EVENT_RAW_PATH: ${{ github.event_path }}
        continue-on-error: true